<section class="card shadow-sm border-0 mb-4" aria-labelledby="sec-identity">
  <div class="card-body">
    <h2 class="h5 card-title" id="sec-identity">Project identity</h2>
    <p class="text-body-secondary">One row on the Project Master sheet. Project ID stays with the project.</p>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="project-id">Project ID</label>
        <input id="project-id" class="form-control" readonly [value]="state.project().id" />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="project-number">Project number</label>
        <input id="project-number" class="form-control" [value]="state.project().number" (input)="state.setText('number', $event)" />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="project-fy">Financial year</label>
        <input id="project-fy" class="form-control" [value]="state.project().financialYear" (input)="state.setText('financialYear', $event)" />
      </div>
      <div class="col-12">
        <label class="form-label" for="project-name">Project name</label>
        <input id="project-name" class="form-control" [value]="state.project().name" (input)="state.setText('name', $event)" />
      </div>
      <div class="col-md-6">
        <label class="form-label" for="project-manager">Project manager</label>
        <input id="project-manager" class="form-control" [value]="state.project().manager" (input)="state.setText('manager', $event)" />
      </div>
    </div>
  </div>
</section>

<section class="card shadow-sm border-0 mb-4" aria-labelledby="sec-class">
  <div class="card-body">
    <h2 class="h5 card-title" id="sec-class">Classification</h2>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="portfolio">Portfolio</label>
        <select id="portfolio" class="form-select" [value]="state.project().portfolio" (change)="state.setChoice('portfolio', $event)">
          <option value="" [selected]="state.project().portfolio === ''">Select</option>
          @for (option of state.choices(state.portfolios, state.project().portfolio); track option) {
            <option [value]="option" [selected]="option === state.project().portfolio">{{ option }}</option>
          }
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="programme">Programme</label>

<section class="card shadow-sm border-0 mb-4" aria-labelledby="sec-dates">
  <div class="card-body">
    <h2 class="h5 card-title" id="sec-dates">Schedule</h2>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="planned-start">Planned start date</label>
        <input id="planned-start" class="form-control" type="date" [value]="state.project().plannedStart" (input)="state.setDate('plannedStart', $event)" />
      </div>
      <div class="col-md-6">
        <label class="form-label" for="actual-start">Actual start date</label>
        <input id="actual-start" class="form-control" type="date" [value]="state.project().actualStart" (input)="state.setDate('actualStart', $event)" />
      </div>
      <div class="col-md-6">
        <label class="form-label" for="planned-end">Planned completion date</label>
        <input id="planned-end" class="form-control" type="date" [value]="state.project().plannedCompletion" (input)="state.setDate('plannedCompletion', $event)" />
      </div>
      <div class="col-md-6">
        <label class="form-label" for="actual-end">Actual completion date</label>
        <input id="actual-end" class="form-control" type="date" [value]="state.project().actualCompletion" (input)="state.setDate('actualCompletion', $event)" />
      </div>
      <div class="col-md-6">
        <app-number-field
          label="Contract duration (months)"
          [value]="state.project().contractMonths"
          (valueChange)="state.setProjectNumber('contractMonths', $event)"
        />
      </div>
    </div>
  </div>
</section>

<section class="card shadow-sm border-0" aria-labelledby="sec-budget">
  <div class="card-body">
    <h2 class="h5 card-title" id="sec-budget">Budgets and completion</h2>
    <div class="row g-3">
      <div class="col-md-6">
        <app-number-field
          label="DOT allocation (R)"
          [value]="state.project().dotAllocation"
          (valueChange)="state.setProjectNumber('dotAllocation', $event)"
        />
      </div>
      <div class="col-md-6">
        <app-number-field
          label="Roll-over (R)"
          [value]="state.project().rollOver"
          (valueChange)="state.setProjectNumber('rollOver', $event)"
        />
      </div>
      <div class="col-md-6">
        <app-number-field
          label="Baseline projection (R)"
          [value]="state.project().baselineProjection"
          (valueChange)="state.setProjectNumber('baselineProjection', $event)"
        />
      </div>
      <div class="col-md-6">
        <app-number-field
          label="% stage of completion"
          [value]="state.project().stageCompletion"
          [max]="100"
          (valueChange)="state.setProjectNumber('stageCompletion', $event)"
        />
      </div>
    </div>
  </div>
</section>
