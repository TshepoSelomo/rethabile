<div class="workspace">
  <app-side-nav [userName]="state.userName" />

  <div class="workspace-main">
    <header class="workspace-bar">
      <div class="workspace-title">
        <p class="crumb">Monthly returns <span>/</span> {{ state.pageTitle() }}</p>
        <h1>{{ state.project().name }} <small>{{ state.project().code }}</small></h1>
        <p class="context">{{ state.formatMonth(state.month()) }}</p>
      </div>
      <div class="workspace-tools">
      <div class="context-pickers">
        <label class="field">
          <span>Project</span>
          <select #projectSelect [value]="state.projectId()" (change)="onProject($event)">
            @for (item of state.projects(); track item.id) {
              <option [value]="item.id" [selected]="item.id === state.projectId()">
                {{ item.code }} · {{ item.name }}
              </option>
            }
          </select>
        </label>
        <label class="field">
          <span>Month</span>
          <input #monthInput type="month" [value]="state.month()" (change)="onMonth($event)" />
        </label>
      </div>
      <div class="workspace-actions">
        <p role="status">{{ state.statusLine() }}</p>
        <button type="button" class="btn" (click)="state.persist('draft')">Save draft</button>
        <button type="button" class="btn btn-primary" (click)="state.persist('submitted')">Submit</button>
      </div>
      </div>
    </header>

    @if (state.pending()) {
      <div class="pending" role="alert">
        <p>This return has unsaved changes.</p>
        <div>
          <button type="button" class="btn btn-primary" (click)="state.saveAndContinue()">Save draft</button>
          <button type="button" class="btn" (click)="state.discardPending()">Discard</button>
          <button type="button" class="btn" (click)="keepEditing()">Keep editing</button>
        </div>
      </div>
    }

    <router-outlet />
  </div>
</div>
