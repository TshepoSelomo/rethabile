<aside class="side-nav">
  <div class="nav-brand">
    <div class="logo-plate">
      <img class="logo-bar" src="prasa-logo.svg" alt="PRASA" />
    </div>
    <div class="brand-copy">
      <strong>Monthly returns</strong>
      <span>PRASA</span>
    </div>
  </div>

  <nav class="nav-menu" aria-label="Return sections">
    @for (item of items; track item.path) {
      <a class="nav-link" [routerLink]="item.path" routerLinkActive="active">
        <span class="nav-index">{{ item.index }}</span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="nav-footer">
    <div class="user-profile">
      <div class="avatar" aria-hidden="true">{{ initials() }}</div>
      <div class="user-info">
        <p class="user-name">{{ userName() }}</p>
        <p class="user-role">Project manager</p>
      </div>
    </div>
    <button type="button" class="sign-out" (click)="leave()">Sign out</button>
  </div>
</aside>
