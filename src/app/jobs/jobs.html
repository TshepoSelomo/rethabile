<section class="card shadow-sm border-0" aria-labelledby="sec-jobs">
  <div class="card-body">
    <h2 class="h5 card-title" id="sec-jobs">Jobs monthly</h2>
    <p class="text-body-secondary">
      {{ state.project().programme || 'No programme' }} · {{ state.period().label }}. Jobs actual is male plus female. Shortfall is planned minus actual.
    </p>
    <div class="row g-3">
      <div class="col-md-4">
        <app-number-field label="Jobs planned" [value]="state.form().jobs.planned" (valueChange)="state.setJob('planned', $event)" />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="jobs-actual">Jobs actual</label>
        <input id="jobs-actual" class="form-control" readonly [value]="state.jobsActual()" />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="jobs-shortfall">Jobs shortfall</label>
        <input
          id="jobs-shortfall"
          class="form-control"
          [class.text-danger]="state.jobsShortfall() > 0"
          [class.fw-semibold]="state.jobsShortfall() > 0"
          readonly
          [value]="state.jobsShortfall()"
        />
      </div>
      <div class="col-md-4">
        <app-number-field label="Male" [value]="state.form().jobs.male" (valueChange)="state.setJob('male', $event)" />
      </div>
      <div class="col-md-4">
        <app-number-field label="Female" [value]="state.form().jobs.female" (valueChange)="state.setJob('female', $event)" />
      </div>
      <div class="col-md-4">
        <app-number-field label="Youth" [value]="state.form().jobs.youth" (valueChange)="state.setJob('youth', $event)" />
      </div>
      <div class="col-md-4">
        <app-number-field label="Above 35" [value]="state.form().jobs.above35" (valueChange)="state.setJob('above35', $event)" />
      </div>
      <div class="col-md-4">
        <app-number-field label="PLD" [value]="state.form().jobs.pld" (valueChange)="state.setJob('pld', $event)" />
      </div>
      <div class="col-md-4">
        <app-number-field label="Foreign" [value]="state.form().jobs.foreign" (valueChange)="state.setJob('foreign', $event)" />
      </div>
      <div class="col-12">
        <label class="form-label" for="jobs-notes">Jobs notes</label>
        <textarea id="jobs-notes" class="form-control" rows="3" [value]="state.form().jobs.notes" (input)="state.setJobNotes($event)"></textarea>
      </div>
    </div>
  </div>
</section>
